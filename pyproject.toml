[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "r-to-law1"
version = "0.1.1"
description = "Principle R to two-dimensional Lorentzian Law I conditional theorem and audits"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
]

[tool.setuptools]
packages = ["r_to_law1", "realizability", "audits"]
package-dir = { "r_to_law1" = "src/r_to_law1", "realizability" = "src/realizability", "audits" = "audits" }
